    --link: color-mix(in srgb, var(--brand) 55%, #fff);
  }
}

.dark {
  --surface-outline: #2c2c2e;
  --surface-tint: var(--muted);
  --control-border: #747478;
  --tertiary-foreground: #8e8e93;
  --background: #000;
  --foreground: #f5f5f7;
  --card: #161617;
  --card-foreground: #f5f5f7;
  --popover: #1c1c1e;
  --popover-foreground: #f5f5f7;
  --primary: var(--brand);
  --primary-foreground: #fff;
  --secondary: #2c2c2e;
  --secondary-foreground: #f5f5f7;
  --muted: #1d1d1f;
  --muted-foreground: #aeaeb2;
  --accent: #2c2c2e;
  --accent-foreground: #f5f5f7;
  --destructive: #ff6568;
  --border: #343437;
  --input: #3a3a3c;
  --ring: #737373;
  --chart-1: var(--brand);
  --chart-2: #d95926;
  --chart-3: #199e70;
  --chart-4: #c98500;
  --chart-5: #262626;
  --ramp-1: #256abf;
  --ramp-2: #3987e5;
  --ramp-3: #6da7ec;
  --ramp-4: #9ec5f4;
  --ramp-5: #cde2fb;
  --sidebar: #171717;
  --sidebar-foreground: #fafafa;
  --sidebar-primary: var(--brand);
  --sidebar-primary-foreground: #fafafa;
  --sidebar-accent: #262626;
  --sidebar-accent-foreground: #fafafa;
  --sidebar-border: #ffffff1a;
  --sidebar-ring: #737373;
}

.page-shell [data-in-view="false"] *, .site-footer[data-in-view="false"] * {
  animation-play-state: paused !important;
}

@keyframes fx-pulse {
  0%, 100% {
    opacity: 1;
  }

  50% {
    opacity: .35;
  }
}

@keyframes fx-ripple {
  0%, 100% {
    opacity: var(--fx-rest, .35);
  }

  35% {
    opacity: 1;
  }
}

@keyframes fx-drift {
  to {
    transform: translateX(var(--fx-drift, -28px));
  }
}

@keyframes fx-draw {
  from {
    stroke-dashoffset: 1px;
  }

  to {
    stroke-dashoffset: 0;
  }
}

@keyframes fx-rise {
  from {
    opacity: 0;
    transform: translateY(var(--fx-rise, 18px));
  }
}

@keyframes fx-fade {
  from {
    opacity: 0;
  }
}

@keyframes fx-grow {
  from {
    opacity: .4;
    transform: scaleY(.25);
  }
}

@keyframes fx-sweep {
  0% {
    opacity: 0;
    transform: translateX(0);
  }

  12%, 88% {
    opacity: 1;
  }

  100% {
    transform: translateX(var(--fx-sweep, 100px));
    opacity: 0;
  }
}

@media (prefers-reduced-motion: no-preference) {
  .fx-pulse {
    animation: 3.2s ease-in-out infinite fx-pulse;
    animation-delay: var(--fx-delay, 0s);
  }

  .fx-ripple {
    animation: 4s ease-in-out infinite both fx-ripple;
    animation-delay: var(--fx-delay, 0s);
  }

  .fx-drift {
    animation: 2.4s linear infinite fx-drift;
  }

  [data-seen] .fx-draw, .fx-draw-now {
    stroke-dasharray: 1;
    animation: 1.4s cubic-bezier(.22, 1, .36, 1) both fx-draw;
    animation-delay: var(--fx-delay, .2s);
  }

  [data-seen] .fx-appear, .fx-appear-now {
    animation: .7s ease-out both fx-fade;
    animation-delay: var(--fx-delay, .2s);
  }

  .fx-sweep {
    animation: 5s linear infinite fx-sweep;
    animation-delay: var(--fx-delay, 0s);
  }

  .page-hero .hero-copy > *, .page-hero > .grid > :first-child:not(figure) > *, .page-hero > :is(p, h1, nav) {
    animation: .8s cubic-bezier(.22, 1, .36, 1) backwards fx-rise;
  }

  .page-hero .hero-copy > :nth-child(2), .page-hero > .grid > :first-child:not(figure) > :nth-child(2), .page-hero > :is(p, h1, nav):nth-child(2) {
    animation-delay: 70ms;
  }

  .page-hero .hero-copy > :nth-child(3), .page-hero > .grid > :first-child:not(figure) > :nth-child(3), .page-hero > :is(p, h1, nav):nth-child(3) {
    animation-delay: .14s;
  }

  .page-hero .hero-copy > :nth-child(4), .page-hero > .grid > :first-child:not(figure) > :nth-child(4), .page-hero > :is(p, h1, nav):nth-child(4) {
    animation-delay: .21s;
  }

  .page-hero .hero-copy > :nth-child(n+5), .page-hero > .grid > :first-child:not(figure) > :nth-child(n+5) {
    animation-delay: .28s;
  }

  .page-hero > .grid > :nth-child(2), .page-hero .hero-art {
    --fx-rise: 28px;
    animation: 1s cubic-bezier(.22, 1, .36, 1) .18s backwards fx-rise;
  }

  .page-hero > :is(dl, .grid ~ *), .page-hero .hero-foot {
    animation: .9s cubic-bezier(.22, 1, .36, 1) .4s backwards fx-rise;
  }
}

@media (prefers-reduced-motion: reduce) {
  .fx-lift, .fx-lift-self {
    transform: none !important;
  }

  html {
    scroll-behavior: auto;
  }

  .page-shell *, .site-footer *, header * {
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }

  .illustration-art > svg, .signal-panel > svg {
    transform: none !important;
  }
}

@media (prefers-reduced-transparency: reduce) {
  header, .product-nav {
    background: var(--background) !important;
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
  }
}

@media (prefers-contrast: more) {
  :root {
    --surface-outline: var(--muted-foreground);
  }

  .surface-panel {
    border-color: var(--muted-foreground);
  }
}

@media (prefers-reduced-motion: reduce) {
  .input-label {
    transition: none;
  }

  .solution-trace, .air-node-body {
    transform: none !important;
  }

  .dial-needle {
    animation: none;
  }

  .resource-graphic-part, .home-lab-part, .home-hardware, .home-evidence-sheet, .home-evidence-record, .home-card-arrow, .home-card-link svg, .home-text-link svg {
    transform: none !important;
  }
}
